name: Auto Unzip to Root

on:
  push:
    paths:
      - '*.zip' # 최상위 경로에 zip 파일이 push 되었을 때만 실행

permissions:
  contents: write # 압축 해제된 파일들을 다시 푸시하기 위해 쓰기 권한 허용

jobs:
  unzip-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2. 최상위에 있는 zip 파일 찾아서 압축 해제 후 zip 제거
      - name: Unzip Files to Root
        run: |
          # 업로드된 첫 번째 zip 파일을 찾음
          ZIP_FILE=$(ls *.zip | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found."
            exit 0
          fi
          
          echo "Found zip file: $ZIP_FILE"
          
          # 최상위 루트에 압축 해제 (-o: 강제 덮어쓰기, -q: 조용히)
          unzip -o -q "$ZIP_FILE" -d ./
          
          # 압축 해제 완료 후 원본 zip 파일 삭제 (저장소 정리)
          rm "$ZIP_FILE"

      # 3. 변경된 파일들을 저장소에 다시 커밋 및 푸시
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          # 변경사항이 있을 때만 커밋 및 푸시 진행
          if ! git diff --staged --quiet; then
            git commit -m "chore: 자동으로 업로드된 ZIP 파일 압축 해제 완료"
            git push
          else
            echo "No changes to commit"
          fi
